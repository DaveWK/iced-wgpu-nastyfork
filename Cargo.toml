[package]
publish = false
rust-version = "1.95"
edition = "2024"
name = "iced_wgpu"
version = "0.14.0"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A renderer for iced on top of wgpu"
homepage = "https://iced.rs"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "graphics",
    "interface",
    "widgets",
]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/DaveWK/iced-wgpu-nastyfork"

[package.metadata.docs.rs]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
all-features = true

[features]
default = ["wgpu/default"]
geometry = [
    "iced_graphics/geometry",
    "lyon",
]
image = ["iced_graphics/image"]
strict-assertions = []
svg = [
    "iced_graphics/svg",
    "resvg/text",
]
web-colors = ["iced_graphics/web-colors"]
webgl = ["wgpu/webgl"]

[lib]
name = "iced_wgpu"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.0"

[dependencies.bytemuck]
version = "1.0"
features = ["derive"]

[dependencies.cryoglyph]
version = "0.1"

[dependencies.futures]
version = "0.3"
features = [
    "std",
    "async-await",
]
default-features = false

[dependencies.glam]
version = "0.25"

[dependencies.guillotiere]
version = "0.6"

[dependencies.iced_debug]
version = "0.14.0"

[dependencies.iced_graphics]
version = "0.14.0"

[dependencies.log]
version = "0.4"

[dependencies.lyon]
version = "1.0"
optional = true

[dependencies.resvg]
version = "0.45"
optional = true

[dependencies.rustc-hash]
version = "2.0"

[dependencies.thiserror]
version = "2"

[dependencies.wgpu]
version = "30"
features = [
    "std",
    "wgsl",
]
default-features = false

[lints.clippy]
# Existing upstream APIs and buffer reuse; keep this port focused.
too_many_arguments = "allow"
drain_collect = "allow"
chunks_exact_to_as_chunks = "allow"
default_trait_access = "deny"
filter_map_next = "deny"
from_over_into = "deny"
large-enum-variant = "allow"
manual_let_else = "deny"
map-entry = "allow"
match-wildcard-for-single-variants = "deny"
needless_borrow = "deny"
new_without_default = "deny"
redundant-closure-for-method-calls = "deny"
result_large_err = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
type-complexity = "allow"
unused_async = "deny"
useless_conversion = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_results = "deny"

[lints.rust.rust_2018_idioms]
level = "deny"
priority = -1

[lints.rustdoc]
broken_intra_doc_links = "forbid"

[patch.crates-io]
cryoglyph = { git = "https://github.com/DaveWK/cryoglyph-nastyfork", rev = "078fab8b8425c5da41465d4aca7fb78c5af3b7fe" }

[dev-dependencies.pollster]
version = "0.4"

[dev-dependencies.iced_graphics]
version = "0.14"
features = ["fira-sans"]

[[test]]
name = "wgpu30"
path = "tests/wgpu30.rs"
